# settings for the sioyek AI popup (one key=value per line, remove the # to enable)

# model passed to `claude --model` (e.g. sonnet, opus, haiku); defaults to claude's default model
#model=sonnet

# target language of "AI Translate"
translate_to=English

# language of all replies; by default claude replies in the language of the selected text / question
#reply_language=English

# location of the claude executable if it isn't found automatically
#claude_path=/opt/homebrew/bin/claude

# documents with more text than this (about 4 characters per token) aren't sent to claude, claude searches them
# for the parts it needs instead. either way the document is only sent once per chat, not with every question
#max_inline_chars=300000
